{% extends "base.html" %}

{% block title %}Hot Torrents - BTSeedAggregator{% endblock %}

{% block content %}
<div class="container">
    <h1>🔥 Hot Torrents</h1>
    <p>Torrents with the most comments across the network.</p>

    <ul id="hot-list" class="hot-list">
        <!-- Hot torrents will be loaded here via JavaScript -->
    </ul>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const hotList = document.getElementById('hot-list');

        async function fetchHotTorrents() {
            try {
                const response = await fetch('/api/hot-torrents');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const torrents = await response.json();

                hotList.innerHTML = ''; // Clear list
                if (torrents.length === 0) {
                    hotList.innerHTML = '<li><p>No commented torrents found yet.</p></li>';
                    return;
                }

                torrents.forEach(torrent => {
                    const li = document.createElement('li');
                    li.className = 'hot-item';

                    const link = document.createElement('a');
                    link.href = `/comments/${torrent.info_hash}`;
                    link.textContent = torrent.name; // Display the name now

                    // Optionally, keep the info_hash visible but less prominent
                    const infoHashSpan = document.createElement('small');
                    infoHashSpan.className = 'info-hash';
                    infoHashSpan.textContent = torrent.info_hash;

                    const count = document.createElement('span');
                    count.textContent = `${torrent.comment_count} comment(s)`;

                    li.appendChild(link);
                    li.appendChild(count);
                    hotList.appendChild(li);
                });
            } catch (error) {
                console.error("Failed to fetch hot torrents:", error);
                hotList.innerHTML = '<li><p>Could not load hot torrents. Please try again later.</p></li>';
            }
        }

        // Initial load
        fetchHotTorrents();
    });
</script>
<style>
.hot-list { list-style: none; padding: 0; }
.hot-item { background-color: #fff; border: 1px solid #dee2e6; border-radius: 5px; padding: 1em; margin-bottom: 1em; display: flex; justify-content: space-between; align-items: center; }
.info-hash { font-family: monospace; font-size: 0.9em; word-break: break-all; }
</style>
{% endblock %}
