<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings - BTSeedAggregator</title>
    <style>
        body { font-family: sans-serif; }
        textarea { width: 100%; height: 150px; }
    </style>
</head>
<body>
    <h1>Settings</h1>
    <h2>Crawler Control</h2>
    <p>Crawler Status: {{ "Running" if crawler_status else "Stopped" }}</p>
    <a href="{{ url_for('start_crawler_route') }}"><button>Start Crawler</button></a>
    <a href="{{ url_for('stop_crawler') }}"><button>Stop Crawler</button></a>

    <h2>Database</h2>
    <a href="{{ url_for('clear_database_route') }}"><button>Clear Database</button></a>

    <form method="post">
        <h2>Proxy Settings</h2>
        <label for="proxy_type">Proxy Type:</label>
        <select id="proxy_type" name="proxy_type">
            <option value="none" {% if proxy.type == 'none' %}selected{% endif %}>None</option>
            <option value="socks5" {% if proxy.type == 'socks5' %}selected{% endif %}>SOCKS5</option>
            <option value="http" {% if proxy.type == 'http' %}selected{% endif %}>HTTP</option>
        </select><br><br>
        <label for="proxy_hostname">Hostname:</label>
        <input type="text" id="proxy_hostname" name="proxy_hostname" value="{{ proxy.hostname }}"><br><br>
        <label for="proxy_port">Port:</label>
        <input type="text" id="proxy_port" name="proxy_port" value="{{ proxy.port }}"><br><br>
        <label for="proxy_username">Username:</label>
        <input type="text" id="proxy_username" name="proxy_username" value="{{ proxy.username }}"><br><br>
        <label for="proxy_password">Password:</label>
        <input type="password" id="proxy_password" name="proxy_password" value="{{ proxy.password }}"><br><br>

        <h2>Bootstrap Nodes</h2>
        <label for="bootstrap_nodes">Bootstrap Nodes (one per line):</label><br>
        <textarea id="bootstrap_nodes" name="bootstrap_nodes">{{ bootstrap_nodes }}</textarea><br><br>

        <h2>Trackers</h2>
        <label for="trackers">Tracker URLs (one per line):</label><br>
        <textarea id="trackers" name="trackers">{{ trackers }}</textarea><br><br>

        <h2>Startup Torrents</h2>
        <label for="startup_torrents">Info Hashes (one per line):</label><br>
        <textarea id="startup_torrents" name="startup_torrents">{{ startup_torrents }}</textarea><br><br>

        <input type="submit" value="Save Settings">
    </form>
    <p><a href="{{ url_for('index') }}">Back to Main Page</a></p>
</body>
</html>
