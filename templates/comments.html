{% extends "base.html" %}

{% block title %}Comments for {{ info_hash }} - BTSeedAggregator{% endblock %}

{% block content %}
<div class="container">
    <h1>Comments for <code>{{ info_hash }}</code></h1>

    <div class="comment-form">
        <h3>Post a new comment</h3>
        <form id="new-comment-form">
            <textarea id="comment-text" name="text" rows="4" required placeholder="Write your comment here..."></textarea>
            <br><br>
            <button type="submit">Submit</button>
        </form>
    </div>

    <h2>Discussion</h2>
    <ul id="comments-list" class="comments-list">
        <!-- Comments will be loaded here -->
    </ul>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const infoHash = "{{ info_hash }}";
        const commentsList = document.getElementById('comments-list');
        const commentForm = document.getElementById('new-comment-form');
        const commentTextArea = document.getElementById('comment-text');

        async function fetchComments() {
            try {
                const response = await fetch(`/api/comments/${infoHash}`);
                const comments = await response.json();

                commentsList.innerHTML = ''; // Clear list
                if (comments.length === 0) {
                    commentsList.innerHTML = '<li><p>No comments yet. Be the first to post!</p></li>';
                    return;
                }

                comments.forEach(comment => {
                    const li = document.createElement('li');
                    li.className = 'comment-item';

                    const author = document.createElement('div');
                    author.className = 'comment-author';
                    author.textContent = `Author: ${comment.author_id.substring(0, 12)}...`;

                    const text = document.createElement('p');
                    text.textContent = comment.text;

                    const meta = document.createElement('div');
                    meta.className = 'comment-meta';
                    meta.textContent = `Posted on: ${new Date(comment.timestamp * 1000).toLocaleString()}`;

                    li.appendChild(author);
                    li.appendChild(text);
                    li.appendChild(meta);
                    commentsList.appendChild(li);
                });
            } catch (error) {
                console.error("Failed to fetch comments:", error);
                commentsList.innerHTML = '<li><p>Could not load comments.</p></li>';
            }
        }

        commentForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = commentTextArea.value;
            if (!text.trim()) return;

            try {
                const response = await fetch(`/api/comments/${infoHash}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                const result = await response.json();
                if (result.status === 'success') {
                    commentTextArea.value = '';
                    setTimeout(fetchComments, 500);
                } else {
                    alert('Failed to post comment: ' + (result.message || 'Unknown error'));
                }
            } catch (error) {
                console.error("Failed to post comment:", error);
                alert('An error occurred while posting your comment.');
            }
        });

        fetchComments();
    });
</script>

<style>
.comment-form { margin-bottom: 2em; }
textarea { width: 100%; padding: 0.5em; font-size: 1em; border-radius: 5px; border: 1px solid #ced4da; box-sizing: border-box; }
button { font-size: 1em; padding: 0.5em 1em; border-radius: 5px; border: none; background-color: #007bff; color: white; cursor: pointer; }
.comments-list { list-style: none; padding: 0; }
.comment-item { background-color: #fff; border: 1px solid #dee2e6; border-radius: 5px; padding: 1em; margin-bottom: 1em; }
.comment-author { font-weight: bold; font-size: 0.9em; color: #495057; word-break: break-all; }
.comment-meta { font-size: 0.8em; color: #6c757d; }
code { word-wrap: break-word; }
</style>
{% endblock %}
