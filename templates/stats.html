{% extends "base.html" %}

{% block title %}Network Stats - BTSeedAggregator{% endblock %}

{% block content %}
<div class="container">
    <h1>📊 P2P Network Statistics</h1>

    <div id="stats-container" class="stats-container">
        <p>Loading stats...</p>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const statsContainer = document.getElementById('stats-container');

        async function fetchStats() {
            try {
                const response = await fetch('/api/stats');
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const stats = await response.json();

                statsContainer.innerHTML = `
                    <div class="stat-item"><strong>Your Peer ID:</strong> <code>${stats.peer_id}</code></div>
                    <div class="stat-item"><strong>Connected Peers:</strong> ${stats.connected_peers}</div>
                    <h4>Connected Peer List:</h4>
                    <ul class="peer-list">
                        ${stats.peer_list.length > 0 ? stats.peer_list.map(p => `<li>${p}</li>`).join('') : '<li>No peers connected.</li>'}
                    </ul>
                `;
            } catch (error) {
                console.error("Failed to fetch stats:", error);
                statsContainer.innerHTML = '<p>Could not load network statistics.</p>';
            }
        }

        // Initial load and refresh every 5 seconds
        fetchStats();
        setInterval(fetchStats, 5000);
    });
</script>

<style>
.stats-container { background-color: #fff; border: 1px solid #dee2e6; border-radius: 5px; padding: 1em; }
.stat-item { margin-bottom: 0.5em; }
.peer-list { list-style: none; padding-left: 1em; font-family: monospace; font-size: 0.9em; max-height: 300px; overflow-y: auto; word-break: break-all; }
code { word-break: break-all; }
</style>
{% endblock %}
