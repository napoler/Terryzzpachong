<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BTSeedAggregator</title>
    <style>
        body { font-family: sans-serif; }
        #torrents_table, #log { width: 100%; border-collapse: collapse; margin-top: 10px; }
        #torrents_table th, #torrents_table td { border: 1px solid #ddd; padding: 8px; }
        #torrents_table th { background-color: #f2f2f2; }
        #log { height: 200px; overflow-y: scroll; border: 1px solid #ddd; padding: 5px; }
        .search-controls { margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>BTSeedAggregator</h1>
    <p><a href="{{ url_for('settings') }}">Settings</a> | <a href="{{ url_for('api_help') }}">API Help</a></p>

    <div class="search-controls">
        <input type="text" id="search_query" placeholder="Search...">
        <input type="number" id="min_size" placeholder="Min size (bytes)">
        <input type="number" id="max_size" placeholder="Max size (bytes)">
        <select id="sort_by">
            <option value="name">Name</option>
            <option value="size">Size</option>
            <option value="files">Files</option>
        </select>
        <select id="sort_order">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
        </select>
        <button onclick="search()">Search</button>
    </div>

    <table id="torrents_table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Size</th>
                <th>Files</th>
                <th>Info Hash</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <h2>Log</h2>
    <div id="log"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            var socket = io.connect(location.protocol + '//' + document.domain + ':' + location.port);

            socket.on('new_torrent', function(data) {
                var table_body = document.querySelector("#torrents_table tbody");
                var new_row = table_body.insertRow(0);
                new_row.innerHTML = `
                    <td>${data.name}</td>
                    <td>${data.size}</td>
                    <td>${data.files}</td>
                    <td>${data.info_hash}</td>
                    <td><button onclick="search('${data.name}')">Find Related</button></td>
                `;
            });

            socket.on('log_message', function(msg) {
                document.getElementById('log').innerHTML += `<p>${msg.data}</p>`;
            });

            socket.on('clear_torrents', function() {
                document.querySelector("#torrents_table tbody").innerHTML = "";
            });

            window.search = function(query) {
                var search_query = query || document.getElementById('search_query').value;
                var min_size = document.getElementById('min_size').value;
                var max_size = document.getElementById('max_size').value;
                var sort_by = document.getElementById('sort_by').value;
                var sort_order = document.getElementById('sort_order').value;

                socket.emit('search', {
                    query: search_query,
                    min_size: min_size,
                    max_size: max_size,
                    sort_by: sort_by,
                    sort_order: sort_order
                });
            }
        });
    </script>
</body>
</html>
