{% extends "base.html" %}
{% block title %}Live Log - BTSeedAggregator{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Live Log Stream</h2>
    <div id="log-container" class="bg-dark text-white p-3" style="height: 600px; overflow-y: scroll; font-family: monospace;">
        <!-- Log messages will be dynamically inserted here -->
    </div>
</div>

<script>
    $(document).ready(function() {
        var socket = io();
        var logContainer = $('#log-container');

        socket.on('log', function(msg) {
            var logMessage = $('<div>').text(msg.data);
            logContainer.append(logMessage);
            logContainer.scrollTop(logContainer[0].scrollHeight); // Auto-scroll to bottom
        });
    });
</script>
{% endblock %}
